<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Festival Running Order</title>
    <meta name="theme-color" content="#0a0a0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SMS Schedule">
    <link rel="manifest" id="manifest-placeholder">
    <style>
        :root {
            --bg: #0a0a0c;
            --surface: #141418;
            --surface-accent: #22222a;
            --accent: #facc15;
            --accent-glow: rgba(250, 204, 21, 0.2);
            --primary: #facc15;
            --text: #f8fafc;
            --text-muted: #a1a1aa;
            --border: #27272a;
            --star-color: #facc15;
            --time-color: #fde047;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 30px;
            overscroll-behavior-y: none;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px 8px 16px;
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .header-title h1 {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #facc15, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-pwa {
            font-size: 0.7rem;
            background: rgba(250, 204, 21, 0.12);
            color: var(--primary);
            border: 1px solid rgba(250, 204, 21, 0.3);
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .search-box {
            margin-bottom: 10px;
        }

        .search-box input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .nav-days {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 4px;
        }

        .nav-days::-webkit-scrollbar {
            display: none;
        }

        .day-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            outline: none;
        }

        .day-btn.active {
            background: var(--primary);
            color: #000000;
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.35);
            font-weight: 700;
        }

        .day-btn.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .filter-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            gap: 10px;
        }

        .filter-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.2s ease;
            outline: none;
        }

        .filter-btn.active {
            background: var(--accent);
            color: #000000;
            border-color: var(--accent);
            font-weight: 700;
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.4);
        }

        .global-status {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            text-align: right;
        }

        .container {
            padding: 0 16px;
        }

        .day-block {
            margin-bottom: 24px;
        }

        .global-day-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
            background: rgba(250, 204, 21, 0.08);
            border-left: 4px solid var(--primary);
            padding: 8px 12px;
            margin: 16px 0 12px 0;
            border-radius: 0 8px 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .stage-section {
            margin-bottom: 16px;
        }

        .stage-header {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            padding: 4px 0;
            border-bottom: 1px solid rgba(250, 204, 21, 0.25);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .artist-card {
            background: var(--surface);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border);
            transition: transform 0.1s, border-color 0.2s;
            cursor: pointer;
        }

        .artist-card:active {
            transform: scale(0.98);
        }

        .artist-card.is-fav {
            border-color: rgba(250, 204, 21, 0.6);
            background: linear-gradient(135deg, var(--surface), rgba(250, 204, 21, 0.08));
        }

        .artist-info {
            flex-grow: 1;
            padding-right: 12px;
        }

        .artist-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            margin-bottom: 3px;
        }

        .artist-time {
            font-size: 0.82rem;
            color: var(--time-color);
            font-family: monospace;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .fav-star {
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-muted);
            user-select: none;
            transition: color 0.2s, transform 0.2s;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fav-star.active {
            color: var(--star-color);
            transform: scale(1.15);
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
            background: var(--surface);
            border-radius: 12px;
            border: 1px dashed var(--border);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>SMS Schedule</h1>
            <span class="badge-pwa">Offline PWA</span>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Global suchen (z.B. Skrillex, Main Stage)..." oninput="renderData()">
        </div>
        <div class="nav-days" id="dayNav"></div>
    </header>

    <div class="filter-bar">
        <button class="filter-btn" id="favFilterBtn" onclick="toggleFavFilter()">
            <span>★</span> Alle Favoriten (<span id="favCount">0</span>)
        </button>
        <div class="global-status" id="globalStatus">Tagesansicht</div>
    </div>

    <main class="container" id="scheduleContainer"></main>

    <script>

Karla Blum"}, {"time": "20:00–21:15", "artist": "Lexy & K-Paul"}, {"time": "21:15–22:30", "artist": "Ely Oaks"}, {"time": "22:30–00:00", "artist": "KAACEE KomaCasper"}, {"time": "00:00–01:30", "artist": "REWI"}, {"time": "01:30–03:00", "artist": "Vieze Asbak"}, {"time": "03:15–04:15", "artist": "Angerfist"}, {"time": "04:15–05:00", "artist": "Basskiller"}], "Sun Stage": [{"time": "17:30–18:45", "artist": "Charleen Herzig"}, {"time": "18:45–20:00", "artist": "Kim Swim"}, {"time": "20:00–21:30", "artist": "Mischluft"}, {"time": "21:30–23:00", "artist": "Funk Tribu PRES. TRIBE A/V SHOW"}, {"time": "23:00–00:00", "artist": "Kalte Liebe LIVE"}, {"time": "00:00–01:30", "artist": "Klangkuenstler"}, {"time": "01:30–03:00", "artist": "Nico Moreno"}, {"time": "03:00–04:30", "artist": "I Hate Models"}, {"time": "04:30–06:00", "artist": "Fantasm"}], "SMS.Fortress": [{"time": "18:00–19:30", "artist": "BEXTC"}, {"time": "19:30–21:00", "artist": "NOTMYTYPE"}, {"time": "21:00–22:30", "artist": "Neon Graveyard"}, {"time": "22:30–00:00", "artist": "NIKOLINA"}, {"time": "00:00–01:30", "artist": "Nicolas Julian"}, {"time": "01:30–03:00", "artist": "A.N.I."}, {"time": "03:00–04:30", "artist": "JOWI"}, {"time": "04:30–06:00", "artist": "ElMefti"}], "SMS.Beach": [{"time": "14:00–15:00", "artist": "JOGA am Strand"}, {"time": "15:00–16:30", "artist": "Sarazar"}, {"time": "16:30–18:00", "artist": "Niconé"}, {"time": "18:00–19:30", "artist": "Mikah"}, {"time": "19:30–21:00", "artist": "Dominique Jardin"}, {"time": "21:00–22:30", "artist": "Township Rebellion"}, {"time": "22:30–00:00", "artist": "AEREA"}, {"time": "00:00–03:00", "artist": "Mika Heggemann B2B Davyboi"}, {"time": "03:15–05:00", "artist": "Bonnie Strange"}, {"time": "05:00–07:00", "artist": "Kyanu"}, {"time": "07:00–09:00", "artist": "Rainer Wachtelborn"}], "Breaks'n'Drums": [{"time": "18:00–19:00", "artist": "Kim Noble vs. Die Genossen Fett"}, {"time": "20:00–21:30", "artist": "Pull180"}, {"time": "21:30–22:45", "artist": "Judokay feat. MC Rob.K"}, {"time": "22:45–00:00", "artist": "Enter B2B Qerty"}, {"time": "00:00–01:00", "artist": "T&Sugah"}, {"time": "01:00–02:30", "artist": "Andy C"}, {"time": "02:30–03:30", "artist": "Tantron"}, {"time": "03:30–04:30", "artist": "VMAX B2B KIMMO"}, {"time": "04:30–06:00", "artist": "Hasky"}], "Club Stage": [{"time": "19:00–20:00", "artist": "Linda Grazia"}, {"time": "20:00–21:00", "artist": "Blondee"}, {"time": "21:00–22:00", "artist": "JO'L"}, {"time": "22:00–23:00", "artist": "DIA Plattenpussys"}, {"time": "23:00–00:00", "artist": "Plastik Funk"}, {"time": "00:00–01:00", "artist": "Justin Prince"}, {"time": "01:00–02:00", "artist": "Ostekke"}, {"time": "02:00–03:00", "artist": "Taktstörer"}, {"time": "03:00–04:00", "artist": "BLVCK CROWZ"}, {"time": "04:00–05:00", "artist": "AVE"}, {"time": "05:00–06:00", "artist": "Fappe & Bru"}], "SMS.Boat": [{"time": "11:00–12:00", "artist": "Franz!"}, {"time": "12:00–13:00", "artist": "Phake"}, {"time": "13:00–14:00", "artist": "Charleen Herzig"}, {"time": "14:00–15:00", "artist": "Davyboi"}, {"time": "15:00–16:00", "artist": "Andata"}, {"time": "16:00–17:00", "artist": "LEVT"}, {"time": "17:00–18:00", "artist": "KAACEE KomaCasper"}, {"time": "18:00–19:00", "artist": "Mika Heggemann"}, {"time": "19:00–20:00", "artist": "Township Rebellion"}]}, "09.08. So": {"SMS.Beach": [{"time": "09:00–11:00", "artist": "Alice DiMar"}, {"time": "11:00–13:00", "artist": "Gunjah"}, {"time": "13:00–15:00", "artist": "Markus Kavka"}, {"time": "15:00–17:00", "artist": "LEVT"}]}};
        let activeDay = "05.08. Mi";
        let showOnlyFavs = false;
        let favorites = JSON.parse(localStorage.getItem("sms_favs") || "[]");

        // Dynamic Manifest Injection
        const manifest = {
            "name": "SMS Running Order",
            "short_name": "SMS Schedule",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0a0a0c",
            "theme_color": "#0a0a0c",
            "icons": [
                {
                    "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a0c'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='%23facc15'>⚡</text></svg>",
                    "sizes": "192x192 512x512",
                    "type": "image/svg+xml"
                }
            ]
        };
        const stringManifest = JSON.stringify(manifest);
        const blobManifest = new Blob([stringManifest], {type: 'application/json'});
        document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(blobManifest));

        // Service Worker
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'sms-pwa-v6';
                self.addEventListener('install', e => {
                    e.waitUntil(
                        caches.open(CACHE_NAME).then(cache => cache.addAll(['./']))
                    );
                    self.skipWaiting();
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(
                        caches.match(e.request).then(res => res || fetch(e.request))
                    );
                });
            `;
            const blobSW = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blobSW)).catch(() => {});
        }

        function saveFavs() {
            localStorage.setItem("sms_favs", JSON.stringify(favorites));
            document.getElementById("favCount").innerText = favorites.length;
        }

        function toggleFav(id) {
            const index = favorites.indexOf(id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(id);
            }
            saveFavs();

            // Direct DOM update without full re-render (prevents losing click state/scroll)
            const card = document.querySelector(`[data-id="${CSS.escape(id)}"]`);
            if (card) {
                const isFav = favorites.includes(id);
                card.classList.toggle('is-fav', isFav);
                const star = card.querySelector('.fav-star');
                if (star) {
                    star.classList.toggle('active', isFav);
                }
            }

            // If we are in "Only Favorites" view, re-render to update the list
            if (showOnlyFavs) {
                const scrollPos = window.scrollY;
                renderData();
                window.scrollTo(0, scrollPos);
            }
        }

        function toggleFavFilter() {
            showOnlyFavs = !showOnlyFavs;
            document.getElementById("favFilterBtn").classList.toggle("active", showOnlyFavs);
            renderData();
        }

        function initNav() {
            const nav = document.getElementById("dayNav");
            nav.innerHTML = "";
            Object.keys(scheduleData).forEach((day) => {
                const btn = document.createElement("button");
                btn.className = `day-btn ${day === activeDay ? 'active' : ''}`;
                btn.id = `nav_day_${day.replace(/[^a-zA-Z0-9]/g, '_')}`;
                btn.innerText = day;
                btn.onclick = () => {
                    activeDay = day;
                    renderData();
                };
                nav.appendChild(btn);
            });
            saveFavs();
        }

        function renderData() {
            const container = document.getElementById("scheduleContainer");
            const searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
            const statusEl = document.getElementById("globalStatus");
            container.innerHTML = "";

            const isGlobalMode = showOnlyFavs || searchQuery !== "";

            // Update UI Day nav state
            document.querySelectorAll('.day-btn').forEach(btn => {
                if (isGlobalMode) {
                    btn.classList.add('disabled');
                    btn.classList.remove('active');
                } else {
                    btn.classList.remove('disabled');
                    const btnDay = btn.innerText;
                    btn.classList.toggle('active', btnDay === activeDay);
                }
            });

            if (showOnlyFavs && searchQuery !== "") {
                statusEl.innerText = "Favoriten + Suche";
            } else if (showOnlyFavs) {
                statusEl.innerText = "Alle Favoriten";
            } else if (searchQuery !== "") {
                statusEl.innerText = "Globale Suche";
            } else {
                statusEl.innerText = `Tag: ${activeDay}`;
            }

            const daysToEvaluate = isGlobalMode ? Object.keys(scheduleData) : [activeDay];
            let hasGlobalContent = false;

            daysToEvaluate.forEach(day => {
                const dayData = scheduleData[day];
                if (!dayData) return;

                let dayHasContent = false;
                const dayBlock = document.createElement("div");
                dayBlock.className = "day-block";

                if (isGlobalMode) {
                    const dayTitle = document.createElement("div");
                    dayTitle.className = "global-day-title";
                    dayTitle.innerText = day;
                    dayBlock.appendChild(dayTitle);
                }

                Object.keys(dayData).forEach(stage => {
                    const artists = dayData[stage];
                    const filteredArtists = artists.filter(item => {
                        const artistId = `${day}_${stage}_${item.artist}_${item.time}`;
                        const isFav = favorites.includes(artistId);
                        const matchesSearch = item.artist.toLowerCase().includes(searchQuery) || stage.toLowerCase().includes(searchQuery);

                        if (showOnlyFavs && !isFav) return false;
                        return matchesSearch;
                    });

                    if (filteredArtists.length > 0) {
                        dayHasContent = true;
                        hasGlobalContent = true;

                        const stageEl = document.createElement("div");
                        stageEl.className = "stage-section";

                        let stageHtml = `<div class="stage-header"><span>${stage}</span></div>`;

                        filteredArtists.forEach(item => {
                            const artistId = `${day}_${stage}_${item.artist}_${item.time}`;
                            const isFav = favorites.includes(artistId);

                            stageHtml += `
                                <div class="artist-card ${isFav ? 'is-fav' : ''}" data-id="${artistId}" onclick="toggleFav('${artistId}')">
                                    <div class="artist-info">
                                        <div class="artist-name">${item.artist}</div>
                                        <div class="artist-time">${item.time}</div>
                                    </div>
                                    <div class="fav-star ${isFav ? 'active' : ''}">
                                        ★
                                    </div>
                                </div>
                            `;
                        });

                        stageEl.innerHTML = stageHtml;
                        dayBlock.appendChild(stageEl);
                    }
                });

                if (dayHasContent) {
                    container.appendChild(dayBlock);
                }
            });

            if (!hasGlobalContent) {
                container.innerHTML = `
                    <div class="empty-state">
                        ${showOnlyFavs ? 'Keine Favoriten gespeichert.' : 'Keine Treffer gefunden.'}
                    </div>
                `;
            }
        }

        initNav();
        renderData();
    </script>
</body>
</html>
